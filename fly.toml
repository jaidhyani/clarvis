# fly.toml app configuration file generated for clarvis on 2026-01-11T01:20:16-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clarvis'
primary_region = 'lax'

[build]

[env]
  CLARVIS_DATA_DIR = '/data'
  CLARVIS_PORT = '3000'
  NODE_ENV = 'production'

[[mounts]]
  source = 'clarvis_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
